name: build-intunewin

# 手動実行で .intunewin をビルドし、アーティファクトとして取得する
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache IntuneWinAppUtil
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: IntuneWinAppUtil
          key: intunewinapputil-master-v1

      - name: Build intunewin
        shell: pwsh
        run: ./scripts/build-intunewin.ps1

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: takumi-guard-intunewin
          path: output/
          retention-days: 7
