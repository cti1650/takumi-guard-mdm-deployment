name: verify-scripts

# MDM 配布スクリプトの E2E 検証を行う。
# 検証内容: (1) 状態別の検知動作 (2) PM インストール前後の検知 (3) 修復による
# 設定投入の完了確認 (4) 対象除外 (アンインストール/revert) による設定解除。
# ビルド成果物は無く、製品スクリプト (intune/ iru/ jamf-pro/) をそのまま実行する。
#
# トリガー:
#   - 手動実行 (target で対象 OS を選択)
#   - 関連スクリプト変更時の push (main) / pull_request では全対象 (windows /
#     wsl / macos) を自動実行
on:
  workflow_dispatch:
    inputs:
      target:
        description: "検証対象 OS"
        required: true
        type: choice
        default: all
        options:
          - all
          - windows
          - wsl
          - macos
  push:
    branches: [main]
    paths:
      - "intune/**"
      - "jamf-pro/**"
      - "iru/**"
      - "scripts/run-windows-verify.ps1"
      - "scripts/run-wsl-verify.ps1"
      - "scripts/run-macos-verify.sh"
      - ".github/workflows/verify-scripts.yml"
  pull_request:
    paths:
      - "intune/**"
      - "jamf-pro/**"
      - "iru/**"
      - "scripts/run-windows-verify.ps1"
      - "scripts/run-wsl-verify.ps1"
      - "scripts/run-macos-verify.sh"
      - ".github/workflows/verify-scripts.yml"

permissions:
  contents: read

# 連続 push 時は古い実行をキャンセルして最新のみ検証する
concurrency:
  group: verify-scripts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # Windows: Intune / Iru スクリプトを本番同等の PowerShell 5.1 で検証
  # ============================================================
  verify-windows:
    # 自動トリガー (push/PR) では常に実行、手動実行時は target に従う
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.target == 'all' || github.event.inputs.target == 'windows' }}
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show tool versions
        shell: powershell
        run: |
          $PSVersionTable.PSVersion
          npm --version
          pip --version

      # 製品スクリプトは Intune / Iru と同じ Windows PowerShell 5.1 (pwsh ではない)
      # で実行する。scripts/run-windows-verify.ps1 が状態遷移シナリオ全体を回し、
      # 期待/実績を GITHUB_STEP_SUMMARY に表出力する。
      - name: Run Windows verify scenario
        shell: powershell
        run: .\scripts\run-windows-verify.ps1
        timeout-minutes: 15

  # ============================================================
  # WSL: Intune の WSL 用スクリプトを実 WSL ディストリビューションで検証
  #   GitHub ホステッドランナーは WSL2 (仮想化必須) が不安定なため WSL1 を
  #   使用する。製品スクリプトは wsl.exe の CLI 面 (--list/-d/--exec) しか
  #   使わず WSL1/2 で同一のため検証として有効。CI の inbox wsl.exe は
  #   UTF-16LE 出力のため NUL 除去フォールバックも実地で通る。
  # ============================================================
  verify-wsl:
    # 自動トリガー (push/PR) では常に実行、手動実行時は target に従う
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.target == 'all' || github.event.inputs.target == 'wsl' }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 素の Debian を登録する (additional-packages は使わない: PM 未導入状態の
      # 検出 = 対象外スキップも検証シナリオに含めるため)
      - name: Set up WSL (WSL1)
        uses: Vampire/setup-wsl@d1da7f2c0322a5ee4f24975344f67fc0f5baf364 # v7.0.0
        with:
          distribution: Debian-13
          wsl-version: 1

      - name: Show WSL status
        shell: powershell
        run: |
          $env:WSL_UTF8 = "1"
          (wsl.exe --list --verbose 2>&1 | Out-String) -replace "`0", ""
          wsl.exe --exec sh -lc 'head -2 /etc/os-release; id -un'

      # 製品スクリプトは Intune と同じ Windows PowerShell 5.1 (pwsh ではない)
      # で実行する。scripts/run-wsl-verify.ps1 が状態遷移シナリオ全体を回し、
      # 期待/実績を GITHUB_STEP_SUMMARY に表出力する。
      - name: Run WSL verify scenario
        shell: powershell
        run: .\scripts\run-wsl-verify.ps1
        timeout-minutes: 25

  # ============================================================
  # macOS: Jamf Pro / Iru スクリプトを検証
  #   コンソールユーザーが有効なら sudo フル実行 (E2E)、無効なら CHILD 抽出に
  #   フォールバックする。どちらで走ったかはサマリーに明記する。
  # ============================================================
  verify-macos:
    # 自動トリガー (push/PR) では常に実行、手動実行時は target に従う
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.target == 'all' || github.event.inputs.target == 'macos' }}
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show tool versions
        run: |
          sw_vers
          uname -m
          node --version || true
          npm --version || true
          python3 --version || true
          pip3 --version || true

      - name: Probe console user
        run: |
          CONSOLE_USER=$(stat -f "%Su" /dev/console 2>/dev/null)
          echo "console user = '${CONSOLE_USER}'"
          echo "CONSOLE_USER=${CONSOLE_USER}" >> "$GITHUB_ENV"

      - name: Run macOS verify scenario
        run: |
          chmod +x scripts/run-macos-verify.sh
          ./scripts/run-macos-verify.sh
        timeout-minutes: 15
