# ============================================
# Takumi Guard MDM配布設定テンプレート
# ============================================
# このファイルをコピーして config.yaml を作成してください
# config.yaml は .gitignore で除外されています

# Takumi Guard Registry URL
# 形式: https://registry.takumi.dev/npm/<ORG_TOKEN>/
# 匿名利用: https://registry.takumi.dev/npm/
takumi:
  registry_url: "https://registry.takumi.dev/npm/"

# 検出設定
detection:
  # 検出対象のホスト名
  expected_host: "registry.takumi.dev"
  # 検出モード: registry | proxy | both
  mode: "registry"

# インストール設定
installation:
  # インストールモード: user | global | both
  mode: "user"
  # バックアップを作成するか
  create_backup: true
  # 既存設定とマージするか
  merge_config: true

# MDM別設定
mdm:
  intune:
    # Remediation Script として登録
    detection_script: "intune/detection/detect-takumi-guard.ps1"
    remediation_script: "intune/remediation/install-takumi-guard.ps1"

  jamf_pro:
    # Extension Attribute + Policy として登録
    extension_attribute: "jamf-pro/extension-attributes/takumi-guard-status.sh"
    policy_script: "jamf-pro/policies/install-takumi-guard.sh"
    # Policy パラメータ
    parameters:
      $4: "${takumi.registry_url}"  # Registry URL
      $5: "${installation.mode}"     # Install mode
      $6: "${installation.create_backup}"  # Create backup

  iru:
    # Custom Script として登録
    macos_script: "iru/custom-scripts/install-takumi-guard-macos.sh"
    windows_script: "iru/custom-scripts/install-takumi-guard-windows.ps1"
    audit_script: "iru/custom-scripts/detect-takumi-guard.sh"
    # 環境変数として渡す
    environment:
      TAKUMI_REGISTRY_URL: "${takumi.registry_url}"
      TAKUMI_INSTALL_MODE: "${installation.mode}"
      TAKUMI_CREATE_BACKUP: "${installation.create_backup}"
